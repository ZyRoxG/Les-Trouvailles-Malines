backend:
  name: git-gateway
  branch: main
  identity_url: https://lestrouvaillesmalines.netlify.app/.netlify/identity
  gateway_url: https://lestrouvaillesmalines.netlify.app/.netlify/git

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "reglages"
    label: "Réglages du site"
    files:
      - label: "Images de l'accueil"
        name: "images-accueil"
        file: "content/settings.json"
        fields:
          - { label: "Image du bandeau (haut de l'accueil)", name: "hero_image", widget: "image" }
          - { label: "Image de la section \"À propos\" (accueil)", name: "about_image", widget: "image" }
      - label: "Page \"À propos\""
        name: "texte-a-propos"
        file: "content/apropos.json"
        fields:
          - { label: "Phrase d'introduction", name: "intro", widget: "string" }
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Texte de la page", name: "body", widget: "markdown" }
      - label: "Photos des catégories"
        name: "photos-categories"
        file: "content/categories.json"
        fields:
          - label: "Catégories"
            name: "images"
            widget: "list"
            fields:
              - label: "Catégorie"
                name: "slug"
                widget: "select"
                options:
                  - { label: "Salon", value: "salon" }
                  - { label: "Cuisine", value: "cuisine" }
                  - { label: "Chambre", value: "chambre" }
                  - { label: "Salle de bain", value: "salle_de_bain" }
                  - { label: "Bureau", value: "bureau" }
                  - { label: "Extérieur", value: "exterieur" }
                  - { label: "Petits prix", value: "petits_prix" }
                  - { label: "Moins de 20 €", value: "moins_de_20" }
                  - { label: "Pratiques au quotidien", value: "pratiques" }
                  - { label: "Rangement & organisation", value: "rangement" }
                  - { label: "Déco", value: "deco" }
                  - { label: "Confort", value: "confort" }
              - { label: "Photo", name: "image", widget: "image" }

  - name: "produits"
    label: "Produits"
    label_singular: "Produit"
    folder: "content/produits"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{name}} — {{price}}"
    fields:
      - { label: "Nom du produit", name: "name", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Points forts"
        name: "points_forts"
        widget: "list"
        required: false
        hint: "Une ligne par point fort (comme les puces d'une fiche Amazon). Ex. « Lavable en machine », « Fabriqué en Europe »..."
      - { label: "Prix affiché", name: "price", widget: "string", required: false, hint: "ex. 24,90 €" }
      - { label: "Photo principale", name: "image_url", widget: "image" }
      - label: "Photos supplémentaires"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Photo", name: "image", widget: "image" }
        hint: "Ajoute autant de photos que tu veux (autres angles, en situation, zoom...)."
      - { label: "Lien d'affiliation Amazon", name: "amazon_url", widget: "string" }
      - label: "Label"
        name: "label"
        widget: "select"
        required: false
        options: ["", "Coup de cœur", "Trouvaille maline", "Petit prix"]
      - label: "Rubrique"
        name: "group"
        widget: "select"
        options:
          - { label: "Pièce par pièce", value: "piece" }
          - { label: "Trouvailles malines", value: "trouvaille" }
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Salon", value: "salon" }
          - { label: "Cuisine", value: "cuisine" }
          - { label: "Chambre", value: "chambre" }
          - { label: "Salle de bain", value: "salle_de_bain" }
          - { label: "Bureau", value: "bureau" }
          - { label: "Extérieur", value: "exterieur" }
          - { label: "Petits prix", value: "petits_prix" }
          - { label: "Moins de 20 €", value: "moins_de_20" }
          - { label: "Pratiques au quotidien", value: "pratiques" }
          - { label: "Rangement & organisation", value: "rangement" }
          - { label: "Déco", value: "deco" }
          - { label: "Confort", value: "confort" }
      - { label: "Mettre à la une (page d'accueil)", name: "featured", widget: "boolean", default: false }

  - name: "inspirations"
    label: "Inspirations"
    label_singular: "Inspiration"
    folder: "content/inspirations"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Résumé (extrait)", name: "excerpt", widget: "text", required: false }
      - { label: "Image de couverture", name: "cover_image_url", widget: "image" }
      - { label: "Contenu de l'article", name: "body", widget: "markdown" }
      - label: "Produits associés (identifiants)"
        name: "product_ids"
        widget: "list"
        required: false
        hint: "Recopie l'identifiant (nom de fichier sans .json) des produits liés, un par ligne."
      - { label: "Publié", name: "published", widget: "boolean", default: true }
